name: arcade-browser-worlds
on:
  push:
    branches: [main, 'quality/arcade-worlds*']
    paths:
      - 'games/**/source/**'
      - 'scripts/browser-worlds/**'
      - '.github/workflows/browser-worlds.yml'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      games:
        description: Game IDs separated by commas, or all
        default: all
        type: string
permissions:
  contents: read
concurrency:
  group: browser-worlds-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exercise worlds on desktop and emulated touch viewports
        run: node scripts/browser-worlds/run.mjs
        env:
          # Sequential expansion: automatic pixel QA follows the current game.
          # Manual dispatch can select any game or run the complete arcade.
          BROWSER_GAMES: ${{ inputs.games || 'royal-roller-ruckus' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-browser-worlds
          path: .browser-worlds/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
