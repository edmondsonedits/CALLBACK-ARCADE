name: Verify Nightfall presentation import
on:
  push:
    branches: [chatgpt/blind-crown-nightfall-v1-5]
    paths: ['.nightfall-transfer/**', '.github/workflows/nightfall-import-once.yml']
permissions:
  contents: write
jobs:
  verify-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/blind-crown-nightfall-v1-5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Restore and verify the exact source delta
        run: python3 .nightfall-transfer/apply.py
      - run: node --test games/blind-crown/tests/standalone.test.mjs
      - run: npm ci
      - run: npm run catalog:generate
      - run: npm run catalog:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run pages:build
      - name: Prepare real Chromium browser checks
        run: |
          python3 -m pip install playwright==1.57.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Verify Canvas privacy and effects
        run: python3 games/blind-crown/tests/presentation/test_visuals.py
      - name: Verify responsive HUD
        run: python3 games/blind-crown/tests/presentation/test_hud.py
      - name: Play the seeded match through the actual UI
        run: python3 games/blind-crown/tests/presentation/test_final.py
      - name: Verify seven-game catalog and HTTP-served game
        run: python3 games/blind-crown/tests/presentation/test_static_http.py
      - name: Commit verified output to the isolated branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/blind-crown STATUS.md catalog/games.json GAME_INDEX.md db/seed.sql
          git diff --cached --quiet || git commit -m 'Import verified Nightfall v1.5 and regenerate arcade catalog'
          git push origin HEAD:chatgpt/blind-crown-nightfall-v1-5
