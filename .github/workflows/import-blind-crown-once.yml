name: Verify Blind Crown import
on:
  push:
    branches: [chatgpt/blind-crown-v1-4-import]
    paths: [games/blind-crown/import/standalone.html.gz.b64]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/blind-crown-v1-4-import
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Restore exact supplied standalone
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          root = Path('games/blind-crown')
          content = gzip.decompress(base64.b64decode((root/'import/standalone.html.gz.b64').read_text(), validate=False))
          expected = '496131ad8031a58b8b2ec78cc1aace73f57ab1ca0646271b383bf48bb108c462'
          assert hashlib.sha256(content).hexdigest() == expected, 'Source hash mismatch'
          (root/'source').mkdir(exist_ok=True)
          (root/'source/index.html').write_bytes(content)
          PY
      - run: npm ci
      - run: npm run catalog:generate
      - run: npm run catalog:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run pages:build
      - name: Record verified import on the isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/blind-crown/source/index.html catalog/games.json GAME_INDEX.md db/seed.sql
          git diff --cached --quiet || git commit -m 'Import exact Blind Crown v1.4 source and regenerate catalog'
          git push origin HEAD:chatgpt/blind-crown-v1-4-import
