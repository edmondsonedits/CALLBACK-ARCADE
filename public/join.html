<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1220" />
    <title>Phone controller · CALLBACK Arcade</title>
    <link rel="stylesheet" href="/party.css" />
    <script type="module" src="/controller.js"></script>
  </head>
  <body class="phone">
    <header>
      <a href="/">← Arcade</a>
      <p class="eyebrow">YOUR PHONE IS THE CONTROLLER</p>
      <h1 id="title">Join a game</h1>
      <p id="connection" role="status">Enter the code on the shared screen.</p>
    </header>
    <main>
      <form id="join-form">
        <label for="code">Room code</label
        ><input
          id="code"
          required
          pattern="[A-Za-z2-9]{6}"
          minlength="6"
          maxlength="6"
          autocomplete="off"
          autocapitalize="characters"
          placeholder="ABC234"
        /><label for="name">Your name</label
        ><input
          id="name"
          required
          maxlength="24"
          autocomplete="nickname"
          placeholder="Player name"
        /><button id="join-button">Join room</button>
      </form>
      <section id="controls" hidden>
        <p id="identity"></p>
        <p id="phase" role="status">Waiting for the host</p>
        <p id="hint"></p>
        <div
          id="stick"
          class="stick"
          role="group"
          aria-label="Move: drag the joystick"
        >
          <span id="knob"></span><span class="stick-label">MOVE</span>
        </div>
        <div
          id="directions"
          class="directions"
          aria-label="Movement buttons"
        ></div>
        <div id="actions" class="actions"></div>
        <button id="awake" class="secondary">Keep screen awake</button>
        <p id="summary" aria-live="polite"></p>
      </section>
      <p id="error" role="alert"></p>
    </main>
  </body>
</html>
