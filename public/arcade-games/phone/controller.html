<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#181125"><title>Phone players · Royal party arcade</title><link rel="stylesheet" href="phone.css"><link rel="stylesheet" href="../shared/arcade-touch.css"><script defer src="controller.js"></script></head>
<body class="cp-controller"><main class="cp-controller-shell">
<header class="cp-controller-header"><div><p class="cp-controller-eyebrow">Royal party arcade</p><h1 id="cp-game">Phone players</h1><p id="cp-identity">Your phone is your controller.</p></div><button type="button" id="cp-change" hidden>Change room</button></header>
<form id="cp-join" class="cp-controller-join"><h2>Join the TV</h2><label for="cp-code">Room code</label><input id="cp-code" name="code" maxlength="4" minlength="4" pattern="[A-Za-z0-9]{4}" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" required><label for="cp-name">Your name</label><input id="cp-name" name="name" maxlength="24" autocomplete="nickname" placeholder="Player name" required><button class="cp-controller-primary" type="submit">Join room</button><p>Open Phone players on the TV, then scan its QR code or enter its room code here.</p><a href="/arcade">Back to arcade</a></form>
<p id="cp-status" class="cp-controller-status" role="status" aria-live="polite">Ready to join.</p>
<section id="cp-play" hidden aria-label="Your game controller"><div class="cp-controller-readout"><strong id="cp-feedback"></strong><span id="cp-delay">Measuring round-trip delay…</span></div><p id="cp-instructions" class="cp-controller-instructions"></p><div id="cp-map-wrap" class="cp-controller-map-wrap" hidden><canvas id="cp-map" width="1000" height="640" aria-label="Your private game view" role="img"></canvas><p id="cp-map-label"></p></div><div class="cp-controller-controls"><div id="cp-stick" class="cp-controller-stick" role="group" aria-label="Movement joystick" hidden tabindex="0"><span id="cp-knob" class="cp-controller-knob"></span><span class="cp-controller-stick-label">Move</span></div><div id="cp-buttons" class="cp-controller-buttons"></div></div><div id="cp-plan-controls" class="cp-controller-plan-controls" hidden><button type="button" id="cp-place" aria-pressed="true">Place</button><button type="button" id="cp-aim" aria-pressed="false">Aim</button><button class="cp-controller-primary" type="button" id="cp-lock">Lock plan</button><div class="cp-controller-plan-fields"><label>Place X<input id="cp-plan-x" type="range" min="0" max="1" step="0.01" value="0.5"></label><label>Place Y<input id="cp-plan-y" type="range" min="0" max="1" step="0.01" value="0.5"></label><label>Aim angle<input id="cp-plan-a" type="range" min="-3.141592653589793" max="3.141592653589793" step="0.01" value="0"></label></div></div><p id="cp-latency-note" class="cp-controller-note">Network latency varies. Watch the TV for the match.</p><button type="button" id="cp-retry" hidden>Reconnect</button></section>
</main><script src="../shared/touch-ui.js"></script></body></html>
