<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#211130"><title>Royal Sumo · Phone controller</title><style>
:root{--bg:#211130;--panel:#39214f;--cream:#fff4d6;--gold:#ffd05a;--red:#ed5367;--cyan:#70e0dd}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--cream);font-family:system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:18px;font-weight:800;touch-action:none}button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}#join{max-width:420px;margin:auto;padding:max(28px,env(safe-area-inset-top)) 24px}h1{font-size:32px;margin:30px 0 6px}p{line-height:1.5}label{display:block;margin:22px 0 8px;font-weight:700}input{width:100%;padding:16px;border:2px solid #8f6d9c;border-radius:14px;background:var(--panel);color:var(--cream)}#code{text-transform:uppercase;letter-spacing:5px;font:700 25px ui-monospace}#join button{width:100%;margin-top:25px;padding:18px;background:var(--gold);color:var(--bg)}#join-status{min-height:48px}#controller[hidden],#join[hidden]{display:none}#controller{height:100%;touch-action:none;user-select:none;-webkit-user-select:none}header{padding:calc(12px + env(safe-area-inset-top)) 18px 8px;display:flex;justify-content:space-between;align-items:center;gap:14px}#identity{font-weight:900;color:var(--gold)}#status{padding:8px 18px;color:var(--cyan);font-weight:650;font-size:14px}#leave{background:var(--panel);color:var(--cream);padding:10px 14px;font-size:13px}#pad{position:absolute;left:0;top:22%;width:54%;bottom:0;touch-action:none}#stick{position:absolute;left:45%;top:55%;width:130px;height:130px;border:3px solid #b4a3be;border-radius:50%;transform:translate(-50%,-50%);background:#ffffff08}#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:var(--cream);box-shadow:0 5px 0 #8e7a94}#actions{position:absolute;right:5%;bottom:calc(12% + env(safe-area-inset-bottom));display:grid;justify-items:center;gap:20px;width:38%}#bash{width:min(34vw,150px);height:min(34vw,150px);border-radius:50%;background:var(--red);color:white;border:6px solid #ffb1a2;font-size:25px;box-shadow:0 7px 0 #9e304f}#bash.held{transform:translateY(5px);box-shadow:0 2px 0 #9e304f;background:#ff8859}#dash{width:112px;min-height:68px;background:var(--cyan);color:var(--bg);font-size:19px;box-shadow:0 6px 0 #368f9f}#actions .hint{margin-top:10px}.hint{font-size:12px;opacity:.7;text-align:center}.disabled #pad,.disabled #actions{opacity:.35;pointer-events:none}#pad .hint{position:absolute;bottom:8%;width:100%}@media(orientation:landscape){header{padding-top:12px}#status{padding-top:0}#pad{top:18%;width:55%}#stick{top:48%;width:125px;height:125px}#actions{bottom:15%;display:flex;flex-direction:row-reverse;width:42%;gap:28px;align-items:center}#bash{width:125px;height:125px}#actions .hint{display:none}h1{margin:0}#join{max-width:600px;padding:14px}#join form{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}#join label{margin:4px 0}#join button{margin:5px 0}#join-status{margin:0}}
</style></head><body><main id="join"><h1>Royal Sumo</h1><p>Your phone. Your fighter.</p><form><div><label for="code">Room code</label><input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" required pattern="[A-Za-z2-9]{6}"></div><div><label for="name">Your name</label><input id="name" maxlength="12" autocomplete="nickname" required></div><button type="submit">Join game</button><p id="join-status" role="status"></p></form></main><main id="controller" hidden class="disabled"><header><div id="identity"></div><button id="leave">Leave</button></header><div id="status" role="status">Connecting…</div><div id="pad" aria-label="Movement joystick"><div id="stick"><div id="knob"></div></div><div class="hint">Drag to move</div></div><div id="actions"><div><button id="bash" aria-label="Hold Bash, release to strike">BASH</button><div class="hint">Hold · release</div></div><button id="dash">DASH</button></div></main><script src="controller.js"></script></body></html>
