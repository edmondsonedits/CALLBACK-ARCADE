<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111a39"><title>Drain Bash · Sump Siege</title><link rel="stylesheet" href="../shared/arena-runtime.css"><link rel="stylesheet" href="../shared/arcade-menu.css"><link rel="stylesheet" href="../shared/arcade-touch.css"></head><body>
 <div class="arena-viewport"></div><header class="arena-hud"><h1>Drain Bash · Sump Siege</h1><div class="arena-round"></div><div class="arena-status" role="status"></div><div class="arena-scoreboard" aria-label="Crown scores"></div><div class="arena-clock" aria-label="Round clock"></div></header>
 <button class="arena-fullscreen" aria-label="Fullscreen">⛶</button><div class="arena-countdown" role="status"></div><div class="arena-help"></div>
 <div class="arena-controls"><button class="arena-stick" aria-label="Move"><span class="arena-stick-knob"></span></button><div class="arena-actions" aria-label="Game actions"></div></div>
 <dialog class="arena-result" aria-label="Round result"><h2></h2><p></p><button class="next">Next round</button><button class="menu">Main menu</button></dialog>
 <p class="arena-error" role="alert" hidden></p>
 <script type="module">import {DRAIN_GAME as game} from './simulation.js';import {mountArena} from '../shared/arena-runtime.js';mountArena(game).catch(e=>{const el=document.querySelector('.arena-error');el.hidden=false;el.textContent='The arena could not load. Please reload or return to the Arcade. '+String(e.message||e)});</script><script src="../shared/arcade-menu.js"></script><script src="../shared/online-view.js"></script><script src="../shared/touch-ui.js"></script></body></html>
